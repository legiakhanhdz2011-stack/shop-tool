<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kênh người bán · Gia Khánh Store</title>
<link rel="stylesheet" href="style.css" />
<style>
  .admin-wrap { max-width: 900px; margin: 0 auto; padding: 24px; }
  .panel { background: var(--panel); border: 1px solid #262b45; border-radius: var(--radius); padding: 20px; margin-bottom: 24px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #262b45; }
  th { color: var(--muted); font-weight: 600; }
  textarea {
    background: #0d1024; border: 1px solid #2a2f52; border-radius: 10px;
    padding: 10px; color: var(--text); width: 100%; font-family: inherit; min-height: 70px;
  }
  .form-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .form-row > div { flex: 1; min-width: 180px; }
  .small-btn { padding: 6px 12px; font-size: 0.8rem; }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">✦ Kênh người bán</div>
    <div class="topbar-right">
      <a href="/" class="btn btn-outline">Về trang chủ</a>
    </div>
  </header>

  <div class="admin-wrap">
    <div id="notAllowed" class="panel hidden">
      <p>⛔ Tài khoản của bạn chưa được cấp quyền "Người bán". Liên hệ admin của shop để được cấp quyền.</p>
    </div>

    <div id="sellerContent" class="hidden">
      <div class="panel">
        <h2>➕ Thêm / Sửa sản phẩm của bạn</h2>
        <form id="productForm">
          <input type="hidden" id="editId" />
          <div class="form-row">
            <div><label>Tên sản phẩm</label><input type="text" id="pName" required /></div>
            <div><label>Giá (đ)</label><input type="number" id="pPrice" required /></div>
          </div>
          <label>Link ảnh (tuỳ chọn)</label>
          <input type="text" id="pImage" placeholder="https://..." />
          <label>Mô tả</label>
          <input type="text" id="pDesc" />
          <label>Kho hàng (mỗi dòng 1 tài khoản/mã, sẽ giao lần lượt cho khách)</label>
          <div style="display:flex; gap:10px; align-items:center; margin-bottom:8px;">
            <label for="pStockFile" class="btn btn-ghost small-btn" style="cursor:pointer; margin:0;">📁 Tải lên từ file .txt</label>
            <input type="file" id="pStockFile" accept=".txt,.csv" style="display:none;" />
            <span id="pStockFileName" style="color:var(--muted); font-size:0.8rem;"></span>
          </div>
          <textarea id="pStock" placeholder="user1:pass1&#10;user2:pass2"></textarea>
          <div style="display:flex; gap:10px; margin-top:14px;">
            <button type="submit" class="btn btn-primary">Lưu sản phẩm</button>
            <button type="button" id="btnCancelEdit" class="btn btn-ghost hidden">Huỷ sửa</button>
          </div>
        </form>
      </div>

      <div class="panel">
        <h2>📦 Sản phẩm của bạn</h2>
        <table>
          <thead><tr><th>ID</th><th>Tên</th><th>Giá</th><th>Kho còn lại</th><th></th></tr></thead>
          <tbody id="productTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="seller.js"></script>
</body>
</html>
